name: Android APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (Unity 2022.3.62f3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect prototype build setup
        id: prototype
        shell: bash
        run: |
          if [ -f Assets/Editor/PrototypeSetup.cs ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK with GameCI
        if: github.event_name == 'workflow_dispatch' || steps.prototype.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: SandsOfLegends.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        if: github.event_name == 'workflow_dispatch' || steps.prototype.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SandsOfLegends-Android-APK
          path: Builds/SandsOfLegends.apk
          if-no-files-found: error
          retention-days: 14
