name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (Unity 2022.3.62f3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity Personal credentials and build entry point
        id: readiness
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" ]] && [[ -f Assets/Editor/BuildScript.cs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK build skipped"
              echo "Configure the repository Actions secrets UNITY_EMAIL and UNITY_PASSWORD to enable headless Unity Personal licensing."
              echo "UNITY_LICENSE is not required for this GameCI CLI Personal licensing flow."
              echo "The build method expected by this project is SandsOfLegends.EditorTools.BuildScript.BuildAndroid."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android APK with GameCI
        id: unity_build
        if: steps.readiness.outputs.ready == 'true'
        continue-on-error: true
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.73
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: SandsOfLegends.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Verify generated APK
        id: apk_check
        if: always() && steps.readiness.outputs.ready == 'true'
        shell: bash
        env:
          UNITY_BUILD_OUTCOME: ${{ steps.unity_build.outcome }}
        run: |
          set -euo pipefail
          APK="build/Android/Android.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Unity did not produce $APK."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          if [[ "$SIZE" -lt 1048576 ]]; then
            echo "::error::APK is unexpectedly small ($SIZE bytes); refusing to publish it."
            exit 1
          fi

          if ! unzip -t "$APK" >/tmp/apk-zip-test.log 2>&1; then
            cat /tmp/apk-zip-test.log
            echo "::error::APK archive integrity check failed."
            exit 1
          fi

          {
            echo "## Android APK verification"
            echo "- File: `$APK`"
            echo "- Size: $SIZE bytes"
            echo "- ZIP integrity: passed"
            echo "- GameCI action outcome: $UNITY_BUILD_OUTCOME"
            if [[ "$UNITY_BUILD_OUTCOME" != "success" ]]; then
              echo "- Note: GameCI reported a post-build/action failure, but the generated APK passed the independent file and archive checks. The APK will be uploaded; inspect the Unity/GameCI logs for the action failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK
        if: steps.readiness.outputs.ready == 'true' && steps.apk_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SandsOfLegends-Android-APK
          path: build/Android/Android.apk
          if-no-files-found: error
          retention-days: 14
