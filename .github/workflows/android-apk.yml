name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (Unity 2022.3.62f3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity Personal credentials and build entry point
        id: readiness
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" ]] && [[ -f Assets/Editor/BuildScript.cs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK build skipped"
              echo "Configure the repository Actions secrets UNITY_EMAIL and UNITY_PASSWORD to enable headless Unity Personal licensing."
              echo "UNITY_LICENSE is not required for this GameCI CLI Personal licensing flow."
              echo "The build method expected by this project is SandsOfLegends.EditorTools.BuildScript.BuildAndroid."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android APK with GameCI
        if: steps.readiness.outputs.ready == 'true'
        uses: game-ci/unity-builder@v6.0.0
        # Unity's BuildPipeline succeeds and writes the APK, but GameCI's post-build
        # log validator currently returns a false failure during license cleanup.
        # The explicit APK integrity check below is the authoritative gate.
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.73
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: SandsOfLegends.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Verify APK output
        if: always() && steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          test -s build/Android/Android.apk
          unzip -t build/Android/Android.apk >/dev/null
          echo "APK exists and ZIP integrity check passed."
          ls -lh build/Android/Android.apk

      - name: Upload APK
        if: always() && steps.readiness.outputs.ready == 'true' && hashFiles('build/Android/Android.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SandsOfLegends-Android-APK
          path: build/Android/Android.apk
          if-no-files-found: error
          retention-days: 14
