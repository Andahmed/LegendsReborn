name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (Unity 2022.3.62f3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity Personal credentials and build entry point
        id: readiness
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" ]] && [[ -f Assets/Editor/BuildScript.cs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK build skipped"
              echo "Configure the repository Actions secrets UNITY_EMAIL and UNITY_PASSWORD to enable headless Unity Personal licensing."
              echo "UNITY_LICENSE is not required for this GameCI CLI Personal licensing flow."
              echo "The build method expected by this project is SandsOfLegends.EditorTools.BuildScript.BuildAndroid."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android APK with GameCI
        if: steps.readiness.outputs.ready == 'true'
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.73
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: SandsOfLegends.EditorTools.BuildScript.BuildAndroid
          # BuildScript writes to Builds/SandsOfLegends.apk; GameCI must collect
          # this same directory from its container and copy it back to the runner.
          buildsPath: Builds
          allowDirtyBuild: true

      - name: Verify APK output
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          test -s Builds/SandsOfLegends.apk
          ls -lh Builds/SandsOfLegends.apk

      - name: Upload APK
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SandsOfLegends-Android-APK
          path: Builds/SandsOfLegends.apk
          if-no-files-found: error
          retention-days: 14
